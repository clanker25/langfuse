allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = false
allow-print-in-tests = false

disallowed-methods = [
  { path = "std::process::exit", reason = "skips Drop, so shutdown and telemetry flushing would not run; return ExitCode instead" },
]
